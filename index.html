<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metropolis Contact - Smart Landing Page</title>

  <!-- GA4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DL4C0JH2J1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-DL4C0JH2J1');
  </script>

  <!-- jQuery - REQUIRED for Creatio -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>

  <!-- Creatio Tracking Scripts -->
  <script src="https://webtracking-v01.creatio.com/JS/track-cookies.js"></script>
  <script src="https://webtracking-v01.creatio.com/JS/create-object.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container {
      background: #fff;
      padding: 40px;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
      animation: fadeIn 0.5s ease-in;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      width: 160px;
      margin-bottom: 20px;
    }

    h2 {
      color: #333;
      margin-bottom: 10px;
      font-size: 24px;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #555;
      font-size: 13px;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 2px solid #e0e0e0;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      margin-top: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    #toast {
      margin-top: 15px;
      font-size: 13px;
      min-height: 40px;
      padding: 10px;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .toast-success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .toast-error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .loading-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .required {
      color: #e74c3c;
    }
  </style>
</head>

<body>
  <div class="container">
    <img src="Metropolis_logo.jpg" alt="Metropolis Logo" class="logo" onerror="this.style.display='none'">
    <h2>Join Metropolis</h2>
    <p class="subtitle">Experience the future of urban living</p>

    <form id="contact-form">
      <div class="form-group">
        <label>First Name <span class="required">*</span></label>
        <input type="text" id="contact-first-name" name="FirstName" placeholder="Enter your first name" required>
      </div>

      <div class="form-group">
        <label>Last Name</label>
        <input type="text" id="contact-last-name" name="LastName" placeholder="Enter your last name">
      </div>

      <div class="form-group">
        <label>Email <span class="required">*</span></label>
        <input type="email" id="contact-email-input" name="Email" placeholder="your@email.com" required>
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="contact-number" name="Phone" placeholder="+1 234 567 8900">
      </div>

      <button type="submit" id="contact-submit-btn">Get Started</button>
    </form>

    <div id="toast"></div>
  </div>

  <script>
    /* ================= CONFIGURATION ================= */
    const WEBHOOK = "https://webhooks.creatio.com/webhooks/a92f744b-4c7c-4fdb-81e9-53cca979a993";
    const GA_ID = "G-DL4C0JH2J1";
    const CREATIO_LANDING_ID = 'c76b7951-3b99-43d3-9466-01abaf130f43';
    const CREATIO_FORM_ID = 'a6058324-c3ec-aa2e-add4-12522446fcca';
    const CREATIO_ENTITY_NAME = 'FormSubmit';

    /* ================= UTM TRACKING ================= */
    function getUTM() {
      const params = new URLSearchParams(window.location.search);
      return {
        utm_source: params.get("utm_source") || "",
        utm_medium: params.get("utm_medium") || "",
        utm_campaign: params.get("utm_campaign") || "",
        utm_term: params.get("utm_term") || "",
        utm_content: params.get("utm_content") || ""
      };
    }

    /* ================= IDENTITY MANAGEMENT ================= */
    const Identity = {
      get: () => {
        try { 
          return JSON.parse(localStorage.getItem("metropolis_identity")); 
        } catch(e) { 
          return null; 
        }
      },
      save: (data) => {
        try { 
          localStorage.setItem("metropolis_identity", JSON.stringify(data)); 
        } catch(e) {}
      }
    };

    /* ================= GA CLIENT ID ================= */
    function getClientId() {
      return new Promise((resolve) => {
        if (typeof gtag !== "function") return resolve("");
        gtag('get', GA_ID, 'client_id', (clientId) => resolve(clientId || ""));
      });
    }

    /* ================= TRACKING FUNCTIONS ================= */
    function track(event, params = {}) {
      if (typeof gtag === "function") {
        gtag('event', event, params);
        console.log(`[GA4] Tracked: ${event}`, params);
      }
    }

    function generateUserId(email) {
      return btoa(encodeURIComponent(email));
    }

    function identify(email) {
      if (typeof gtag !== "function") return;
      const userId = generateUserId(email);
      gtag('config', GA_ID, {
        user_id: userId,
        send_page_view: false
      });
    }

    /* ================= CREATIO CONFIGURATION ================= */
    // This is the critical config that Creatio expects
    window.creatioFormConfig = {
      fields: {
        "FirstName": "#contact-first-name",
        "LastName": "#contact-last-name",
        "Email": "#contact-email-input",
        "Phone": "#contact-number"
      },
      contactFields: {
        "FirstName": "#contact-first-name",
        "LastName": "#contact-last-name",
        "Email": "#contact-email-input",
        "Phone": "#contact-number"
      },
      customFields: {
        "FormId": CREATIO_FORM_ID,
        "LandingPageId": CREATIO_LANDING_ID
      },
      landingId: CREATIO_LANDING_ID,
      serviceUrl: "https://184784-crm-bundle.creatio.com/0/ServiceModel/GeneratedObjectWebFormService.svc/SaveWebFormObjectData"
    };

    /* ================= CREATIO TRACKING INITIALIZATION ================= */
    function initCreatioTracking() {
      console.log("[Creatio] Initializing tracking...");
      
      // Initialize landing tracking
      if (typeof window.initLanding === 'function') {
        window.initLanding(window.creatioFormConfig);
        console.log("[Creatio] Landing initialized");
      }
      
      // Track page view
      if (typeof ct === 'function') {
        ct('init');
        ct('trackPageview', {
          landingId: CREATIO_LANDING_ID
        });
        console.log("[Creatio] Page view tracked");
      }
    }

    /* ================= UI HELPERS ================= */
    function showToast(message, isError = false) {
      const el = document.getElementById("toast");
      el.textContent = message;
      el.className = isError ? 'toast-error' : 'toast-success';
      
      setTimeout(() => {
        if (el.textContent === message) {
          el.textContent = '';
          el.className = '';
        }
      }, 5000);
    }

    function setButtonLoading(loading) {
      const btn = document.getElementById("contact-submit-btn");
      if (loading) {
        btn.disabled = true;
        btn.innerHTML = '<span class="loading-spinner"></span> Processing...';
      } else {
        btn.disabled = false;
        btn.innerHTML = 'Get Started';
      }
    }

    function validateEmail(email) {
      const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return re.test(email);
    }

    /* ================= FORM SUBMISSION ================= */
    async function handleFormSubmit(e) {
      e.preventDefault();
      
      const firstName = document.getElementById("contact-first-name").value.trim();
      const lastName = document.getElementById("contact-last-name").value.trim();
      const email = document.getElementById("contact-email-input").value.trim();
      const phone = document.getElementById("contact-number").value.trim();
      
      // Validation
      if (!firstName) {
        showToast("Please enter your first name", true);
        document.getElementById("contact-first-name").focus();
        return;
      }
      
      if (!email) {
        showToast("Please enter your email address", true);
        document.getElementById("contact-email-input").focus();
        return;
      }
      
      if (!validateEmail(email)) {
        showToast("Please enter a valid email address", true);
        document.getElementById("contact-email-input").focus();
        return;
      }
      
      // Track form submission attempt
      track("form_submit_attempt", {
        form_id: CREATIO_FORM_ID,
        landing_id: CREATIO_LANDING_ID
      });
      
      setButtonLoading(true);
      
      try {
        // Get GA client ID
        const clientId = await getClientId();
        const utm = getUTM();
        
        // Call Creatio submission function
        if (typeof window.createObjectFromLanding === 'function') {
          console.log("[Creatio] Submitting form data...");
          window.createObjectFromLanding(window.creatioFormConfig);
          console.log("[Creatio] Form submission triggered");
        } else if (typeof window.createObject === 'function') {
          console.log("[Creatio] Using createObject function");
          window.createObject(window.creatioFormConfig);
        } else {
          console.error("[Creatio] No submission function available");
          throw new Error("Creatio submission function not available");
        }
        
        // Identity linking for Creatio analytics
        if (typeof ct === 'function') {
          ct('setUserId', clientId + ':' + GA_ID);
          ct('identify', { 
            email: email,
            firstName: firstName,
            lastName: lastName
          });
          console.log("[Creatio] Identity linked");
        }
        
        // Send to webhook
        const webhookPayload = {
          FirstName: firstName,
          LastName: lastName,
          Email: email,
          PhoneNumber: phone,
          EntityName: CREATIO_ENTITY_NAME,
          FormId: CREATIO_FORM_ID,
          LandingPageId: CREATIO_LANDING_ID,
          TrackingUserId: clientId + ':' + GA_ID,
          PageUrl: window.location.href,
          ReferrerUrl: document.referrer || "",
          UserAgent: navigator.userAgent,
          Timestamp: new Date().toISOString(),
          ...utm
        };
        
        const res = await fetch(WEBHOOK, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(webhookPayload)
        });
        
        if (!res.ok) throw new Error(`Webhook failed: ${res.status}`);
        
        // Save identity
        Identity.save({ email, firstName, lastName, clientId });
        identify(email);
        
        // Track successful lead
        track("lead_created", {
          method: "web_form",
          email_domain: email.split("@")[1],
          form_id: CREATIO_FORM_ID
        });
        
        showToast("🎉 Welcome to Metropolis! We'll contact you soon.");
        
        // Reset form after short delay
        setTimeout(() => {
          document.getElementById("contact-form").reset();
        }, 1000);
        
      } catch (err) {
        console.error("[Error] Form submission failed:", err);
        showToast("❌ Something went wrong. Please try again.", true);
        track("form_submit_error", { error: err.message });
      } finally {
        setButtonLoading(false);
      }
    }

    /* ================= PAGE LOAD TRACKING ================= */
    function trackPageLoad() {
      // Track page view
      track("page_view", {
        page_title: document.title,
        page_location: window.location.href,
        landing_id: CREATIO_LANDING_ID
      });
      
      // Track session start
      track("session_start", { 
        timestamp: Date.now(),
        referrer: document.referrer || 'direct'
      });
      
      // Restore identity if exists
      const saved = Identity.get();
      if (saved && saved.email) {
        identify(saved.email);
        console.log("[Identity] Restored user:", saved.email);
      }
      
      // Track UTM parameters
      const utm = getUTM();
      if (utm.utm_source || utm.utm_medium || utm.utm_campaign) {
        track("utm_parameters", utm);
        console.log("[UTM] Tracked:", utm);
      }
    }

    /* ================= FORM FIELD TRACKING ================= */
    function setupFieldTracking() {
      const emailField = document.getElementById("contact-email-input");
      let formStartTracked = false;
      
      emailField.addEventListener("focus", () => {
        if (!formStartTracked) {
          track("form_start", { form_id: CREATIO_FORM_ID });
          formStartTracked = true;
        }
      });
    }

    /* ================= INITIALIZATION ================= */
    $(document).ready(function() {
      console.log("[Init] Page loaded, initializing...");
      
      // Initialize Creatio tracking
      initCreatioTracking();
      
      // Track page load
      trackPageLoad();
      
      // Setup form tracking
      setupFieldTracking();
      
      // Setup form submission
      const form = document.getElementById("contact-form");
      form.addEventListener("submit", handleFormSubmit);
      
      console.log("[Init] All systems ready - jQuery version:", $.fn.jquery);
    });
  </script>
</body>
</html>
