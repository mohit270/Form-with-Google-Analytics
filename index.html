<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Metropolis Contact</title>

  <!-- ✅ GA4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DL4C0JH2J1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-DL4C0JH2J1');
  </script>

  <!-- ✅ Creatio GA Bridge (IMPORTANT) -->
  <script>
  (async () => {
    const GA_ID = "G-DL4C0JH2J1";

    const clientId = await new Promise(resolve => {
      gtag('get', GA_ID, 'client_id', resolve);
    });

    const sessionId = await new Promise(resolve => {
      gtag('get', GA_ID, 'session_id', resolve);
    });

    const trackingId = `${clientId}:${GA_ID}`;

    /* Inject TrackingUserId into form */
    function inject() {
      document.querySelectorAll("form").forEach(form => {
        let input = form.querySelector("input[name='TrackingUserId']");
        if (!input) {
          input = document.createElement("input");
          input.type = "hidden";
          input.name = "TrackingUserId";
          form.appendChild(input);
        }
        input.value = trackingId;
      });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", inject);
    } else {
      inject();
    }
  })();
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      width: 320px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 6px;
      margin-top: 15px;
      cursor: pointer;
    }
    button:disabled {
      background: #aaa;
    }
    #toast {
      margin-top: 10px;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>Join Metropolis</h2>

  <form id="contact-form">
    <input type="text" id="contact-first-name" placeholder="First Name" required>
    <input type="text" id="contact-last-name" placeholder="Last Name">
    <input type="email" id="contact-email-input" placeholder="Email" required>
    <input type="number" id="contact-number" placeholder="Phone Number">
    <button type="submit" id="contact-submit-btn">Get Started</button>
  </form>

  <div id="toast"></div>
</div>

<script>
const WEBHOOK = "https://webhooks.creatio.com/webhooks/a92f744b-4c7c-4fdb-81e9-53cca979a993";
const GA_ID = "G-DL4C0JH2J1";

const CREATIO_LANDING_ID  = 'c76b7951-3b99-43d3-9466-01abaf130f43';
const CREATIO_FORM_ID     = 'a6058324-c3ec-aa2e-add4-12522446fcca';
const CREATIO_ENTITY_NAME = 'FormSubmit';

function toast(msg, error=false) {
  const el = document.getElementById("toast");
  el.style.color = error ? "red" : "green";
  el.textContent = msg;
}

function getClientId() {
  return new Promise(resolve => {
    gtag('get', GA_ID, 'client_id', resolve);
  });
}

document.getElementById("contact-form").addEventListener("submit", async (e) => {
  e.preventDefault();

  const firstName = document.getElementById("contact-first-name").value.trim();
  const lastName  = document.getElementById("contact-last-name").value.trim();
  const email     = document.getElementById("contact-email-input").value.trim();
  const phone     = document.getElementById("contact-number").value.trim();

  if (!firstName || !email) {
    toast("Fill required fields", true);
    return;
  }

  const clientId = await getClientId();

  try {
    const res = await fetch(WEBHOOK, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        FirstName: firstName,
        LastName: lastName,
        Email: email,
        PhoneNumber: phone,

        EntityName: CREATIO_ENTITY_NAME,
        FormId: CREATIO_FORM_ID,
        LandingPageId: CREATIO_LANDING_ID,

        TrackingUserId: clientId + ':' + GA_ID,
        PageUrl: window.location.href,
        ReferrerUrl: document.referrer || ''
      })
    });

    if (!res.ok) throw new Error();

    toast("Success!");

  } catch {
    toast("Error submitting form", true);
  }
});
</script>

</body>
</html>
