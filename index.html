<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Metropolis Contact</title>

  <!-- GA4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DL4C0JH2J1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-DL4C0JH2J1');
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      width: 320px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
    }

    .logo {
      width: 140px;
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 6px;
      margin-top: 15px;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #toast {
      margin-top: 10px;
      font-size: 13px;
      min-height: 16px;
    }
  </style>
</head>

<body>

<div class="container">
  <img src="Metropolis_logo.jpg" class="logo">
  <h2>Join Metropolis</h2>

  <form id="contact-form">
    <input type="text" id="contact-first-name" placeholder="First Name" required>
    <input type="text" id="contact-last-name" placeholder="Last Name">
    <input type="email" id="contact-email-input" placeholder="Email" required>
    <button type="submit" id="contact-submit-btn">Get Started</button>
  </form>

  <div id="toast"></div>
</div>

<script>
const WEBHOOK = "https://webhooks.creatio.com/webhooks/a92f744b-4c7c-4fdb-81e9-53cca979a993";
const GA_ID = "G-DL4C0JH2J1";

/* ---------------- IDENTITY ---------------- */
const Identity = {
  get: () => {
    try { return JSON.parse(localStorage.getItem("metropolis_identity")); }
    catch { return null; }
  },
  save: (data) => {
    try { localStorage.setItem("metropolis_identity", JSON.stringify(data)); }
    catch {}
  }
};

/* ---------------- GA CLIENT ID (FIXED) ---------------- */
function getClientId() {
  return new Promise((resolve) => {
    if (typeof gtag !== "function") {
      resolve("");
      return;
    }
    gtag('get', GA_ID, 'client_id', (clientId) => {
      resolve(clientId || "");
    });
  });
}

/* ---------------- TRACKING ---------------- */
function track(event, params={}) {
  if (typeof gtag === "function") {
    gtag('event', event, params);
  }
}

/* ---------------- SAFE USER IDENTIFY ---------------- */
function generateUserId(email) {
  return btoa(email); // simple encoding (safe alternative to raw email)
}

function identify(email) {
  if (typeof gtag !== "function") return;

  const userId = generateUserId(email);

  gtag('config', GA_ID, {
    user_id: userId,
    send_page_view: false
  });
}

/* ---------------- UI ---------------- */
function toast(msg, error=false) {
  const el = document.getElementById("toast");
  el.style.color = error ? "red" : "green";
  el.textContent = msg;
}

/* ---------------- MAIN ---------------- */
document.addEventListener("DOMContentLoaded", () => {

  track("page_view");
  track("session_start", { timestamp: Date.now() });

  const saved = Identity.get();
  if (saved) identify(saved.email);

  const form = document.getElementById("contact-form");
  const btn  = document.getElementById("contact-submit-btn");

  /* track form start */
  document.getElementById("contact-email-input")
    .addEventListener("focus", () => {
      track("form_start");
    });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    if (btn.disabled) return;

    const firstName = document.getElementById("contact-first-name").value.trim();
    const lastName  = document.getElementById("contact-last-name").value.trim();
    const email     = document.getElementById("contact-email-input").value.trim();

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!firstName || !email) {
      toast("Fill required fields", true);
      return;
    }

    if (!emailRegex.test(email)) {
      toast("Invalid email", true);
      return;
    }

    track("form_submit_attempt");

    btn.disabled = true;
    btn.textContent = "Sending...";

    try {
      const clientId = await getClientId();

      const res = await fetch(WEBHOOK, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": "YOUR_SECRET_KEY" // optional security
        },
        body: JSON.stringify({
          FirstName: firstName,
          LastName: lastName,
          Email: email,
          TrackingUserId: clientId,
          PageUrl: window.location.href
        })
      });

      if (!res.ok) throw new Error("Failed");

      Identity.save({ email, firstName, clientId });

      identify(email);

      track("lead_created", {
        method: "web_form",
        email_domain: email.split("@")[1]
      });

      toast("Welcome to Metropolis!");
      form.reset();

    } catch (err) {
      toast("Network error. Try again.", true);
    }

    btn.disabled = false;
    btn.textContent = "Get Started";
  });

});
</script>

</body>
</html>
