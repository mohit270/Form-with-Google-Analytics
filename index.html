<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metropolis Contact - Smart Landing Page</title>

  <!-- GA4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DL4C0JH2J1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-DL4C0JH2J1');
  </script>

  <!-- Creatio Web Analytics Library -->
  <script src="https://cdn.creatio.com/JS/crt-landing-page.js"></script>
  <script>
    // Configure Creatio Web Analytics
    document.addEventListener('DOMContentLoaded', function() {
      if (typeof crtLanding !== 'undefined') {
        crtLanding.webhookServiceUrl = 'https://webhooks.creatio.com/webhooks/a92f744b-4c7c-4fdb-81e9-53cca979a993';
        crtLanding.setParameter('LandingPageId', 'c76b7951-3b99-43d3-9466-01abaf130f43');
        crtLanding.setParameter('FormId', 'a6058324-c3ec-aa2e-add4-12522446fcca');
        crtLanding.init();
        
        // Field tracking for web analytics
        const trackField = (fieldId, fieldName) => {
          const field = document.getElementById(fieldId);
          if (field) {
            field.addEventListener('focus', () => {
              crtLanding.sendEvent('field_focus', { field: fieldName });
            });
            field.addEventListener('blur', () => {
              if (field.value.trim()) {
                crtLanding.sendEvent('field_completed', { field: fieldName });
              }
            });
          }
        };

        trackField('contact-first-name', 'first_name');
        trackField('contact-last-name', 'last_name');
        trackField('contact-email-input', 'email');
        trackField('contact-number', 'phone');
        
        console.log('[Creatio Web Analytics] Connected and tracking');
      }
    });
  </script>

  <!-- jQuery -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
  <script>
    if (typeof jQuery === 'undefined') {
      console.warn('[jQuery] Primary CDN failed, loading fallback...');
      document.write('<script src="https://code.jquery.com/jquery-1.11.2.min.js"><\/script>');
    }
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .honeypot {
      position: absolute;
      left: -9999px;
      opacity: 0;
      height: 0;
      width: 0;
      overflow: hidden;
    }

    .container {
      background: #fff;
      padding: 40px;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
    }

    .logo {
      width: 160px;
      margin-bottom: 20px;
    }

    h2 {
      color: #333;
      margin-bottom: 10px;
      font-size: 24px;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #555;
      font-size: 13px;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 2px solid #e0e0e0;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    input.error {
      border-color: #e74c3c;
    }

    .error-message {
      color: #e74c3c;
      font-size: 11px;
      margin-top: 5px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      margin-top: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
      transition: transform 0.2s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      min-width: 300px;
      padding: 12px 20px;
      border-radius: 8px;
      text-align: center;
      z-index: 1000;
    }

    .toast-success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .toast-error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .loading-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .required {
      color: #e74c3c;
    }

    .auto-save-indicator {
      font-size: 10px;
      color: #28a745;
      margin-top: 10px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .auto-save-indicator.show {
      opacity: 1;
    }
  </style>
</head>

<body>
  <div class="container">
    <img src="Metropolis_logo.jpg" alt="Metropolis Logo" class="logo" onerror="this.style.display='none'">
    <h2>Join Metropolis</h2>
    <p class="subtitle">Experience the future of urban living</p>

    <form id="contact-form" method="post" onsubmit="handleFormSubmit(event); return false;">
      <div class="honeypot">
        <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
      </div>

      <div class="form-group">
        <label>First Name <span class="required">*</span></label>
        <input type="text" id="contact-first-name" placeholder="Enter your first name" required>
        <div class="error-message" id="firstNameError">Please enter your first name</div>
      </div>

      <div class="form-group">
        <label>Last Name</label>
        <input type="text" id="contact-last-name" placeholder="Enter your last name">
        <div class="error-message" id="lastNameError"></div>
      </div>

      <div class="form-group">
        <label>Email <span class="required">*</span></label>
        <input type="email" id="contact-email-input" placeholder="your@email.com" required>
        <div class="error-message" id="emailError">Please enter a valid email address</div>
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="contact-number" placeholder="+1 234 567 8900">
        <div class="error-message" id="phoneError"></div>
      </div>

      <button type="submit" id="contact-submit-btn">Get Started</button>
    </form>

    <div class="auto-save-indicator" id="autoSaveIndicator">✓ Draft saved</div>
  </div>

  <div id="toast"></div>

  <script>
    // ========== CONFIGURATION ==========
    const CREATIO_WEBHOOK_URL = 'https://webhooks.creatio.com/webhooks/a92f744b-4c7c-4fdb-81e9-53cca979a993';
    const CREATIO_WEBFORM_ID = 'a6058324-c3ec-aa2e-add4-12522446fcca';
    const GA_ID = "G-DL4C0JH2J1";
    const SUBMIT_COOLDOWN = 30000;
    const AUTO_SAVE_DELAY = 2000;
    
    let lastSubmitTime = 0;
    let autoSaveTimer = null;
    let isSubmitting = false;

    // ========== UTM TRACKING ==========
    function getUTM() {
      const params = new URLSearchParams(window.location.search);
      return {
        utm_source: params.get("utm_source") || "",
        utm_medium: params.get("utm_medium") || "",
        utm_campaign: params.get("utm_campaign") || "",
        utm_term: params.get("utm_term") || "",
        utm_content: params.get("utm_content") || ""
      };
    }

    // ========== FORM DRAFT AUTO-SAVE ==========
    const FormDraft = {
      save: () => {
        const formData = {
          firstName: document.getElementById("contact-first-name").value,
          lastName: document.getElementById("contact-last-name").value,
          email: document.getElementById("contact-email-input").value,
          phone: document.getElementById("contact-number").value,
          timestamp: Date.now()
        };
        localStorage.setItem("metropolis_form_draft", JSON.stringify(formData));
      },
      load: () => {
        const draft = localStorage.getItem("metropolis_form_draft");
        if (draft) {
          const data = JSON.parse(draft);
          if (Date.now() - data.timestamp < 86400000) {
            document.getElementById("contact-first-name").value = data.firstName || "";
            document.getElementById("contact-last-name").value = data.lastName || "";
            document.getElementById("contact-email-input").value = data.email || "";
            document.getElementById("contact-number").value = data.phone || "";
            return true;
          }
        }
        return false;
      },
      clear: () => localStorage.removeItem("metropolis_form_draft")
    };

    // ========== GA4 TRACKING ==========
    function track(event, params = {}) {
      if (typeof gtag === "function") {
        try {
          gtag('event', event, params);
          console.log(`[GA4] ${event}:`, params);
        } catch(e) {
          console.error(`[GA4] Error:`, e);
        }
      }
    }

    // ========== WEBHOOK SUBMISSION (ONLY ONE - CORRECT FORMAT) ==========
    async function submitToCreatioWebhook(formData) {
      // CRITICAL: Use EXACT format that Creatio expects
      // Based on successful submissions in your screenshot:
      // {"FirstName":"omkar","LastName":"sharma","Email":"omkar.sharma@gmail.com",
      //  "PhoneNumber":"9898909898","EntityName":"FormSubmit","FormId":"a6058324-c3ec-aa2e-add4-12522446fcca"}
      
      const payload = {
        FirstName: formData.firstName,
        LastName: formData.lastName,
        Email: formData.email,
        PhoneNumber: formData.phone,
        EntityName: "FormSubmit",  // REQUIRED - this was missing in failed submissions
        FormId: CREATIO_WEBFORM_ID
      };
      
      // Remove empty fields (optional)
      if (!payload.LastName) delete payload.LastName;
      if (!payload.PhoneNumber) delete payload.PhoneNumber;
      
      console.log('[Creatio] Sending webhook payload:', JSON.stringify(payload, null, 2));
      
      try {
        const response = await fetch(CREATIO_WEBHOOK_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(payload)
        });
        
        if (response.ok) {
          console.log('[Creatio] ✓ Webhook successful');
          return { success: true };
        } else {
          const error = await response.text();
          console.error('[Creatio] ✗ Webhook failed:', error);
          return { success: false, error };
        }
      } catch (error) {
        console.error('[Creatio] ✗ Webhook error:', error);
        return { success: false, error: error.message };
      }
    }

    // ========== UI HELPERS ==========
    let toastTimeout;
    function showToast(message, isError = false) {
      const el = document.getElementById("toast");
      if (toastTimeout) clearTimeout(toastTimeout);
      el.textContent = message;
      el.className = isError ? 'toast-error' : 'toast-success';
      toastTimeout = setTimeout(() => {
        el.textContent = '';
        el.className = '';
      }, 5000);
    }

    function setButtonLoading(loading) {
      const btn = document.getElementById("contact-submit-btn");
      if (loading) {
        btn.disabled = true;
        btn.innerHTML = '<span class="loading-spinner"></span> Processing...';
      } else {
        btn.disabled = false;
        btn.innerHTML = 'Get Started';
      }
    }

    function validateEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function showFieldError(fieldId, show, message = '') {
      const field = document.getElementById(fieldId);
      const errorEl = document.getElementById(`${fieldId}Error`);
      if (!field || !errorEl) return;
      
      if (show) {
        field.classList.add('error');
        errorEl.classList.add('show');
        if (message) errorEl.textContent = message;
      } else {
        field.classList.remove('error');
        errorEl.classList.remove('show');
      }
    }

    // ========== SPAM PROTECTION ==========
    function isSpam() {
      const honeypot = document.getElementById("website");
      if (honeypot && honeypot.value) {
        console.warn('[Security] Honeypot triggered');
        return true;
      }
      return false;
    }

    // ========== FORM SUBMISSION HANDLER ==========
    async function handleFormSubmit(event) {
      event.preventDefault();
      
      if (isSubmitting) {
        showToast("Please wait, already submitting...", true);
        return;
      }
      
      // Rate limiting
      if (Date.now() - lastSubmitTime < SUBMIT_COOLDOWN) {
        const wait = Math.ceil((SUBMIT_COOLDOWN - (Date.now() - lastSubmitTime)) / 1000);
        showToast(`Please wait ${wait} seconds`, true);
        return;
      }
      
      // Spam check
      if (isSpam()) {
        showToast("Submission blocked", true);
        return;
      }
      
      // Get form values
      const firstName = document.getElementById("contact-first-name").value.trim();
      const lastName = document.getElementById("contact-last-name").value.trim();
      const email = document.getElementById("contact-email-input").value.trim();
      const phone = document.getElementById("contact-number").value.trim();
      
      // Reset errors
      showFieldError("contact-first-name", false);
      showFieldError("contact-email-input", false);
      showFieldError("contact-number", false);
      
      // Validate
      let hasError = false;
      if (!firstName) {
        showFieldError("contact-first-name", true, "Please enter your first name");
        hasError = true;
      }
      if (!email) {
        showFieldError("contact-email-input", true, "Please enter your email");
        hasError = true;
      } else if (!validateEmail(email)) {
        showFieldError("contact-email-input", true, "Enter a valid email address");
        hasError = true;
      }
      if (phone && !/^[\+\d\s\-\(\)]{8,}$/.test(phone)) {
        showFieldError("contact-number", true, "Enter a valid phone number");
        hasError = true;
      }
      
      if (hasError) return;
      
      // Track in GA4
      track('form_submit_attempt', { form_id: CREATIO_WEBFORM_ID });
      
      // Track in Creatio Web Analytics
      if (typeof crtLanding !== 'undefined' && crtLanding.sendEvent) {
        crtLanding.sendEvent('form_submit', { formId: CREATIO_WEBFORM_ID });
      }
      
      // Submit
      setButtonLoading(true);
      isSubmitting = true;
      
      const utm = getUTM();
      const formData = { firstName, lastName, email, phone, utm };
      
      try {
        // ONLY ONE SUBMISSION - Direct webhook with correct format
        const result = await submitToCreatioWebhook(formData);
        
        if (result.success) {
          track('lead_created', { 
            method: 'webhook', 
            email_domain: email.split('@')[1] 
          });
          
          showToast("🎉 Welcome to Metropolis! We'll contact you soon.", false);
          lastSubmitTime = Date.now();
          FormDraft.clear();
          
          // Reset form
          document.getElementById("contact-form").reset();
        } else {
          throw new Error(result.error);
        }
      } catch (error) {
        console.error('[Form] Submission error:', error);
        showToast("❌ Something went wrong. Please try again.", true);
        track('form_submit_error', { error: error.message });
      } finally {
        setButtonLoading(false);
        isSubmitting = false;
      }
    }

    // ========== AUTO-SAVE SETUP ==========
    function setupAutoSave() {
      const fields = ['contact-first-name', 'contact-last-name', 'contact-email-input', 'contact-number'];
      const indicator = document.getElementById('autoSaveIndicator');
      
      fields.forEach(fieldId => {
        const field = document.getElementById(fieldId);
        if (field) {
          field.addEventListener('input', () => {
            if (autoSaveTimer) clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(() => {
              FormDraft.save();
              indicator.classList.add('show');
              setTimeout(() => indicator.classList.remove('show'), 2000);
            }, AUTO_SAVE_DELAY);
          });
        }
      });
    }

    // ========== INITIALIZATION ==========
    function init() {
      console.log('[Init] Landing page loaded');
      
      // Load draft
      if (FormDraft.load()) {
        showToast("📝 Draft restored", false);
      }
      
      // Setup auto-save
      setupAutoSave();
      
      // Track page view
      track('page_view', { landing_id: CREATIO_WEBFORM_ID });
      
      // Track UTM parameters
      const utm = getUTM();
      if (utm.utm_source || utm.utm_medium || utm.utm_campaign) {
        track('utm_parameters', utm);
        console.log('[UTM] Tracked:', utm);
      }
    }
    
    // Start when ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
