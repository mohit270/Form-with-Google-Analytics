<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Metropolis Contact</title>

  <!-- GA4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DL4C0JH2J1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-DL4C0JH2J1');
  </script>

  <!-- Creatio Scripts -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
  <script src="https://webtracking-v01.creatio.com/JS/track-cookies.js"></script>
  <script src="https://webtracking-v01.creatio.com/JS/create-object.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      width: 320px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
    }
    .logo {
      width: 140px;
      margin-bottom: 10px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 6px;
      margin-top: 15px;
      cursor: pointer;
      font-weight: bold;
    }
    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }
    #toast {
      margin-top: 10px;
      font-size: 13px;
      min-height: 16px;
    }
  </style>
</head>

<body>

<div class="container">
  <img src="Metropolis_logo.jpg" class="logo">
  <h2>Join Metropolis</h2>

  <form id="contact-form">
    <input type="text" id="contact-first-name" placeholder="First Name" required>
    <input type="text" id="contact-last-name" placeholder="Last Name">
    <input type="email" id="contact-email-input" placeholder="Email" required>
    <input type="tel" id="contact-number" placeholder="Phone Number">
    <button type="submit" id="contact-submit-btn">Get Started</button>
  </form>

  <div id="toast"></div>
</div>

<!-- Creatio Config -->
<script>
var config = {
    fields: {
        "FullName": "#contact-first-name",
        "PhoneNumber": "#contact-number",
        "Email": "#contact-email-input"
    },
    contactFields: {
        "FullName": "#contact-first-name",
        "Phone": "#contact-number",
        "Email": "#contact-email-input"
    },
    customFields: {
        "FormId": "a6058324-c3ec-aa2e-add4-12522446fcca"
    },
    landingId: "c76b7951-3b99-43d3-9466-01abaf130f43",
    serviceUrl: "https://184784-crm-bundle.creatio.com/0/ServiceModel/GeneratedObjectWebFormService.svc/SaveWebFormObjectData"
};

function createObject() {
    landing.createObjectFromLanding(config);
}

function initLanding() {
    landing.initLanding(config);
}

jQuery(document).ready(initLanding);
</script>

<script>
/* ================= CONFIG ================= */
const WEBHOOK = "https://webhooks.creatio.com/webhooks/a92f744b-4c7c-4fdb-81e9-53cca979a993";
const GA_ID = "G-DL4C0JH2J1";
const CREATIO_LANDING_ID  = 'c76b7951-3b99-43d3-9466-01abaf130f43';
const CREATIO_FORM_ID     = 'a6058324-c3ec-aa2e-add4-12522446fcca';
const CREATIO_ENTITY_NAME = 'FormSubmit';

/* ================= UTM TRACKING ================= */
function getUTM() {
  const params = new URLSearchParams(window.location.search);
  return {
    utm_source: params.get("utm_source") || "",
    utm_medium: params.get("utm_medium") || "",
    utm_campaign: params.get("utm_campaign") || ""
  };
}

/* ================= IDENTITY ================= */
const Identity = {
  get: () => {
    try { return JSON.parse(localStorage.getItem("metropolis_identity")); }
    catch { return null; }
  },
  save: (data) => {
    try { localStorage.setItem("metropolis_identity", JSON.stringify(data)); }
    catch {}
  }
};

/* ================= GA CLIENT ID ================= */
function getClientId() {
  return new Promise((resolve) => {
    if (typeof gtag !== "function") return resolve("");
    gtag('get', GA_ID, 'client_id', (clientId) => resolve(clientId || ""));
  });
}

/* ================= TRACKING ================= */
function track(event, params={}) {
  if (typeof gtag === "function") {
    gtag('event', event, params);
  }
}

/* ================= USER IDENTIFY ================= */
function generateUserId(email) {
  return btoa(email);
}

function identify(email) {
  if (typeof gtag !== "function") return;
  gtag('config', GA_ID, {
    user_id: generateUserId(email),
    send_page_view: false
  });
}

/* ================= UI ================= */
function toast(msg, error=false) {
  const el = document.getElementById("toast");
  el.style.color = error ? "red" : "green";
  el.textContent = msg;
}

/* ================= MAIN ================= */
document.addEventListener("DOMContentLoaded", () => {

  track("page_view");
  track("session_start", { timestamp: Date.now() });

  const saved = Identity.get();
  if (saved) identify(saved.email);

  const form = document.getElementById("contact-form");
  const btn  = document.getElementById("contact-submit-btn");

  document.getElementById("contact-email-input")
    .addEventListener("focus", () => track("form_start"));

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    if (btn.disabled) return;

    const firstName = document.getElementById("contact-first-name").value.trim();
    const lastName  = document.getElementById("contact-last-name").value.trim();
    const email     = document.getElementById("contact-email-input").value.trim();
    const phone     = document.getElementById("contact-number").value.trim();

    if (!firstName || !email) {
      toast("Fill required fields", true);
      return;
    }

    if (!email.includes("@")) {
      toast("Invalid email", true);
      return;
    }

    track("form_submit_attempt");

    btn.disabled = true;
    btn.textContent = "Sending...";

    try {
      // 🔥 FULL NAME FIX
      const fullName = (firstName + " " + lastName).trim();
      document.getElementById("contact-first-name").value = fullName;

      // ✅ Creatio submission
      createObject();

      const clientId = await getClientId();
      const utm = getUTM();

      // 🔥 Creatio identity linking
      if (typeof ct === "function") {
        ct('setUserId', clientId + ':' + GA_ID);
        ct('identify', { email: email });
      }

      // ✅ Webhook (enhanced payload)
      const res = await fetch(WEBHOOK, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          FirstName: firstName,
          LastName: lastName,
          Email: email,
          PhoneNumber: phone,

          // ✅ REQUIRED (exact match)
          EntityName: CREATIO_ENTITY_NAME,
          FormId: CREATIO_FORM_ID,
          LandingPageId: CREATIO_LANDING_ID,

          TrackingUserId: clientId + ':' + GA_ID,
          PageUrl: window.location.href,
          ReferrerUrl: document.referrer || ""
        })
      });

      if (!res.ok) throw new Error("Failed");

      Identity.save({ email, firstName, clientId });
      identify(email);

      track("lead_created", {
        method: "web_form",
        email_domain: email.split("@")[1]
      });

      toast("Welcome to Metropolis!");
      form.reset();

    } catch (err) {
      console.error(err);
      toast("Network error. Try again.", true);
    }

    btn.disabled = false;
    btn.textContent = "Get Started";
  });

});
</script>

</body>
</html>
