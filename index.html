<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metropolis - Join the Future</title>

  <!-- GA4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DL4C0JH2J1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-DL4C0JH2J1');
  </script>

  <!-- jQuery - REQUIRED for Creatio -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>

  <!-- Creatio Scripts -->
  <script src="https://webtracking-v01.creatio.com/JS/track-cookies.js"></script>
  <script src="https://webtracking-v01.creatio.com/JS/create-object.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container {
      background: #fff;
      padding: 40px;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
    }

    .logo {
      width: 140px;
      margin-bottom: 15px;
    }

    h2 {
      color: #1a1a2e;
      margin-bottom: 8px;
      font-size: 26px;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: #333;
      font-size: 13px;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 2px solid #e2e8f0;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      margin-top: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.2s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    button:disabled {
      background: #cbd5e0;
      cursor: not-allowed;
    }

    #toast {
      margin-top: 20px;
      font-size: 13px;
      min-height: 45px;
      padding: 10px;
      border-radius: 10px;
    }

    .toast-success {
      background: #c6f6d5;
      color: #22543d;
      border: 1px solid #9ae6b4;
    }

    .toast-error {
      background: #fed7d7;
      color: #742a2a;
      border: 1px solid #fc8181;
    }

    .loading-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .required {
      color: #e53e3e;
    }
  </style>
</head>

<body>
  <div class="container">
    <img src="Metropolis_logo.jpg" alt="Metropolis" class="logo" onerror="this.style.display='none'">
    <h2>Join Metropolis</h2>
    <p class="subtitle">Experience the future of urban living</p>

    <form id="contact-form">
      <div class="form-group">
        <label>First Name <span class="required">*</span></label>
        <input type="text" id="contact-first-name" placeholder="Enter your first name">
      </div>

      <div class="form-group">
        <label>Last Name</label>
        <input type="text" id="contact-last-name" placeholder="Enter your last name">
      </div>

      <div class="form-group">
        <label>Email <span class="required">*</span></label>
        <input type="email" id="contact-email-input" placeholder="your@email.com">
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="contact-number" placeholder="+1 234 567 8900">
      </div>

      <button type="submit" id="contact-submit-btn">Get Started</button>
    </form>

    <div id="toast"></div>
  </div>

  <script>
    // CONFIGURATION
    const WEBHOOK = "https://webhooks.creatio.com/webhooks/a92f744b-4c7c-4fdb-81e9-53cca979a993";
    const GA_ID = "G-DL4C0JH2J1";
    const CREATIO_LANDING_ID = 'c76b7951-3b99-43d3-9466-01abaf130f43';
    const CREATIO_FORM_ID = 'a6058324-c3ec-aa2e-add4-12522446fcca';
    const CREATIO_ENTITY_NAME = 'FormSubmit';

    // UTM TRACKING
    function getUTM() {
      const params = new URLSearchParams(window.location.search);
      return {
        utm_source: params.get("utm_source") || "",
        utm_medium: params.get("utm_medium") || "",
        utm_campaign: params.get("utm_campaign") || ""
      };
    }

    // GA CLIENT ID
    function getClientId() {
      return new Promise((resolve) => {
        if (typeof gtag !== "function") return resolve("");
        gtag('get', GA_ID, 'client_id', (clientId) => resolve(clientId || ""));
      });
    }

    // TRACKING
    function track(event, params = {}) {
      if (typeof gtag === "function") {
        gtag('event', event, params);
        console.log(`[GA4] Tracked: ${event}`, params);
      }
    }

    function generateUserId(email) {
      return btoa(encodeURIComponent(email));
    }

    function identify(email) {
      if (typeof gtag !== "function") return;
      gtag('config', GA_ID, {
        user_id: generateUserId(email),
        send_page_view: false
      });
    }

    // UI HELPERS
    function toast(msg, error = false) {
      const el = document.getElementById("toast");
      el.style.color = error ? "#742a2a" : "#22543d";
      el.style.background = error ? "#fed7d7" : "#c6f6d5";
      el.style.border = error ? "1px solid #fc8181" : "1px solid #9ae6b4";
      el.textContent = msg;
      setTimeout(() => {
        if (el.textContent === msg) {
          el.textContent = "";
          el.style.background = "";
          el.style.border = "";
        }
      }, 5000);
    }

    // CREATIO CONFIGURATION (matches your original working code)
    var creatioConfig = {
      fields: {
        "FullName": "#contact-first-name",
        "PhoneNumber": "#contact-number",
        "Email": "#contact-email-input"
      },
      contactFields: {
        "FullName": "#contact-first-name",
        "Phone": "#contact-number",
        "Email": "#contact-email-input"
      },
      customFields: {
        "FormId": "a6058324-c3ec-aa2e-add4-12522446fcca"
      },
      landingId: "c76b7951-3b43-43d3-9466-01abaf130f43",
      serviceUrl: "https://184784-crm-bundle.creatio.com/0/ServiceModel/GeneratedObjectWebFormService.svc/SaveWebFormObjectData"
    };

    function createObject() {
      if (typeof window.createObjectFromLanding === 'function') {
        window.createObjectFromLanding(creatioConfig);
        console.log("[Creatio] createObjectFromLanding called");
      } else if (typeof window.landing !== 'undefined' && typeof window.landing.createObjectFromLanding === 'function') {
        window.landing.createObjectFromLanding(creatioConfig);
        console.log("[Creatio] landing.createObjectFromLanding called");
      } else {
        console.error("[Creatio] No submission function available");
        throw new Error("Creatio function not available");
      }
    }

    function initLanding() {
      if (typeof window.initLanding === 'function') {
        window.initLanding(creatioConfig);
        console.log("[Creatio] initLanding called");
      }
      if (typeof ct === "function") {
        ct('init');
        console.log("[Creatio] ct initialized");
      }
    }

    // MAIN FORM HANDLER
    document.addEventListener("DOMContentLoaded", () => {
      console.log("[Init] Page loaded");
      
      // Initialize Creatio
      initLanding();
      
      // Track page view
      track("page_view");
      track("session_start", { timestamp: Date.now() });
      
      const form = document.getElementById("contact-form");
      const btn = document.getElementById("contact-submit-btn");
      
      // Track form start
      document.getElementById("contact-email-input").addEventListener("focus", () => {
        track("form_start");
      });
      
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        
        if (btn.disabled) return;
        
        const firstName = document.getElementById("contact-first-name").value.trim();
        const lastName = document.getElementById("contact-last-name").value.trim();
        const email = document.getElementById("contact-email-input").value.trim();
        const phone = document.getElementById("contact-number").value.trim();
        
        // Validation
        if (!firstName || !email) {
          toast("Please fill required fields", true);
          return;
        }
        
        if (!email.includes("@")) {
          toast("Please enter a valid email", true);
          return;
        }
        
        track("form_submit_attempt");
        
        btn.disabled = true;
        btn.innerHTML = '<span class="loading-spinner"></span> Sending...';
        
        try {
          // Combine first and last name for Creatio's FullName field
          const fullName = (firstName + " " + lastName).trim();
          document.getElementById("contact-first-name").value = fullName;
          
          // Submit to Creatio
          createObject();
          
          // Get client ID for tracking
          const clientId = await getClientId();
          const utm = getUTM();
          
          // Link identity for analytics
          if (typeof ct === "function") {
            ct('setUserId', clientId + ':' + GA_ID);
            ct('identify', { email: email });
          }
          
          // Send to webhook
          const res = await fetch(WEBHOOK, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              FirstName: firstName,
              LastName: lastName,
              Email: email,
              PhoneNumber: phone,
              EntityName: CREATIO_ENTITY_NAME,
              FormId: CREATIO_FORM_ID,
              LandingPageId: CREATIO_LANDING_ID,
              TrackingUserId: clientId + ':' + GA_ID,
              PageUrl: window.location.href,
              ReferrerUrl: document.referrer || "",
            })
          });
          
          if (!res.ok) throw new Error("Webhook failed");
          
          // Save identity
          try {
            localStorage.setItem("metropolis_identity", JSON.stringify({ email, firstName, clientId }));
          } catch(e) {}
          
          identify(email);
          
          track("lead_created", {
            method: "web_form",
            email_domain: email.split("@")[1]
          });
          
          toast("🎉 Welcome to Metropolis!");
          form.reset();
          
          // Restore the first name field (since we changed it)
          document.getElementById("contact-first-name").value = "";
          
        } catch (err) {
          console.error("[Error]", err);
          toast("Network error. Please try again.", true);
          track("form_submit_error", { error: err.message });
        } finally {
          btn.disabled = false;
          btn.innerHTML = "Get Started";
        }
      });
    });
  </script>
</body>
</html>
